logger:
  level: debug
  format: text

simulator:
  num_devices: 2
  num_sources: 3
  buffer_capacity: 5
  sources:
    - id: 1
      min_interval: 5.0
      max_interval: 7.0
      start_time: 0.0
    - id: 2
      min_interval: 3.0
      max_interval: 5.0
      start_time: 0.0
    - id: 3
      min_interval: 1.0
      max_interval: 2.0
      start_time: 0.0
  devices:
    - id: 1
      lambda: 0.65
    - id: 2
      lambda: 0.55
  max_simulation_time: 10000.0